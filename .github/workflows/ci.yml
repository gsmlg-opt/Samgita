name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.5"
  OTP_VERSION: "27.3.4.17"
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samgita_hub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: oven-sh/setup-bun@v1
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Install web dependencies
        working-directory: apps/samgita_web
        run: bun install --frozen-lockfile
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - name: Fresh foundation database
        run: |
          mix ecto.create
          mix ecto.migrate
      - name: Scoped foundation tests
        run: >-
          mix test
          apps/samgita/test/samgita_test.exs
          apps/samgita_web/test/samgita_web/controllers/error_html_test.exs
          apps/samgita_web/test/samgita_web/controllers/error_json_test.exs
          apps/samgita_web/test/samgita_web/controllers/fallback_controller_test.exs
          apps/samgita_web/test/samgita_web/controllers/health_controller_test.exs
          apps/samgita_web/test/samgita_web/controllers/info_controller_test.exs
          apps/samgita_web/test/samgita_web/live/dashboard_live_test.exs
          apps/samgita_web/test/samgita_web/plugs
      - run: mix assets.build
      - name: Reject legacy implementation references
        shell: bash
        run: |
          if rg -n 'SamgitaProvider|SamgitaMemory|samgita_provider|samgita_memory|Horde|pgvector|ANTHROPIC_API_KEY|CLAUDE_COMMAND|MEMORY_POOL_SIZE|DNS_CLUSTER_QUERY' apps config deployment Dockerfile docker-compose.yml mix.exs mix.lock devenv.nix .env.example; then
            echo "Legacy implementation reference found"
            exit 1
          fi
      - run: mix dialyzer
      - run: mix hex.audit
      - name: Assemble local production release
        env:
          MIX_ENV: prod
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/samgita_hub_test
          SECRET_KEY_BASE: ci-only-secret-not-for-deployment-0123456789012345678901234567890123456789
          SAMGITA_API_KEYS: ci-only-not-for-deployment
        run: |
          mix deps.get --only prod
          mix assets.deploy
          mix release

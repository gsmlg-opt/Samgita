name: Pinned Codex conformance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.5"
  OTP_VERSION: "27.3.4.17"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  selected-conformance:
    name: Selected actual-binary and platform scenarios
    # Native output/patch qualification requires private user/network namespaces.
    # Ubuntu 24.04's hosted policy denied uid_map in run 40030194617. Keep the
    # same explicit prerequisite/profile as the isolated job, with no sudo change.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CODEX_BINARY: ${{ github.workspace }}/tmp/codex/0.163.0/codex-x86_64-unknown-linux-musl
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SAMGITA_TEST_DATABASE: samgita_redesign_codex_ci_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samgita_redesign_codex_ci_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the verified native artifact cache
        run: echo "RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH=$RUNNER_TEMP/samgita-conformance-nifs" >> "$GITHUB_ENV"
      - name: Required native content-search executable
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
          rg --version
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Fetch and verify immutable source and executable
        timeout-minutes: 6
        run: python3 scripts/codex/fetch_pin.py
      - name: Independent native protocol package
        timeout-minutes: 6
        working-directory: apps/samgita_protocol_codex
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix test
          mix hex.audit
      - name: Required private user and network namespace prerequisites
        timeout-minutes: 1
        run: python3 scripts/codex/check_namespace_prerequisites.py
      - name: Required pinned native sandbox write and denial
        timeout-minutes: 1
        run: python3 scripts/codex/check_native_sandbox_prerequisites.py
      - name: Independent driver build and audit
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix hex.audit
      # Mix partitions the complete sorted test-file set; both halves are required.
      # Preserve the existing deadline as the native suite grows past one step.
      - name: Independent driver and actual-binary scenarios (partition 1 of 2)
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        env:
          MIX_TEST_PARTITION: "1"
        run: mix test --partitions 2 --seed 501432
      - name: Independent driver and actual-binary scenarios (partition 2 of 2)
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        env:
          MIX_TEST_PARTITION: "2"
        run: mix test --partitions 2 --seed 501432
      - name: Outside-umbrella actual-binary consumer
        timeout-minutes: 8
        run: python3 scripts/codex/verify_consumer.py
      - name: Resolve platform dependencies
        timeout-minutes: 6
        run: mix deps.get
      - name: Verify and prime locked platform native artifact
        timeout-minutes: 2
        run: python3 scripts/codex/prime_platform_nif.py
      - name: Fenced platform, API, concurrency and actual-binary journey
        timeout-minutes: 8
        run: |
          mix compile --warnings-as-errors
          mix test apps/samgita/test/samgita/runtime_registration_test.exs apps/samgita/test/samgita/codex_runtime_test.exs apps/samgita/test/samgita/codex_runtime_notification_test.exs apps/samgita/test/samgita/codex_runtime_tool_retirement_test.exs apps/samgita/test/samgita/codex_runtime_race_test.exs apps/samgita/test/samgita/codex_runtime_operator_authority_test.exs apps/samgita_web/test/samgita_web/controllers/codex_runtime_controller_test.exs apps/samgita_web/test/samgita_web/integration/codex_runtime_test.exs --include e2e --include real_codex

  isolated-auth:
    name: Isolated native authentication, executors and metadata
    # This explicit Linux profile needs unprivileged user/network namespaces.
    # It fails on a denied prerequisite; never fall back to host callback ports.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CODEX_BINARY: ${{ github.workspace }}/tmp/codex/0.163.0/codex-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Fetch and verify immutable source and executable
        timeout-minutes: 6
        run: python3 scripts/codex/fetch_pin.py
      - name: Required private user and network namespace prerequisites
        timeout-minutes: 1
        run: python3 scripts/codex/check_namespace_prerequisites.py
      - name: Required pinned native sandbox write and denial
        timeout-minutes: 1
        run: python3 scripts/codex/check_native_sandbox_prerequisites.py
      - name: Private Secret Service profile tools
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus gnome-keyring libglib2.0-bin
      - name: Required private-network authentication profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix test test/native_auth_flow_profile.exs --seed 501432
      - name: Required real executor environment profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_environment_profile.exs --seed 501432
      - name: Required selected-thread executor connection lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_thread_environment_profile.exs --seed 501432
      - name: Required native Apps metadata profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_apps_profile.exs --seed 501432
      - name: Required native Apps catalog and installed profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_app_catalog_profile.exs --seed 501432
      - name: Required native account metadata read profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_account_metadata_profile.exs --seed 501432
      - name: Required native quota read field profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_rate_read_profile.exs --seed 501432
      - name: Required native account credit and nudge profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_account_control_profile.exs --seed 501432
      - name: Required native Gateway OAuth readiness and cancellation profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_gateway_oauth_profile.exs --seed 501432
      - name: Required native Gateway OAuth persistent Secret Service profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_gateway_success_profile.exs --seed 501432
      - name: Required native feedback upload profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_feedback_profile.exs --seed 501432
      - name: Required native remote-control lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_remote_control_profile.exs --seed 501432
      - name: Required native thread revert profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_thread_revert_profile.exs --seed 501432
      - name: Required native Bedrock local controls profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_bedrock_profile.exs --seed 501432
      - name: Required native Bedrock signed authentication recovery profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_bedrock_recovery_profile.exs --seed 501432
      - name: Required native synchronous hook lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_hook_lifecycle_profile.exs --seed 501432
      - name: Required native Guardian review lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_guardian_profile.exs --seed 501432
      - name: Required native review delivery and cold history profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_review_delivery_profile.exs --seed 501432
      - name: Required native command lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_command_lifecycle_profile.exs --seed 501432
      - name: Required offline native model discovery profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_model_discovery_profile.exs --seed 501432
      - name: Required native user-shell lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_user_shell_profile.exs --seed 501432
      - name: Required native user-input and dynamic-tool profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_tool_interactions_profile.exs --seed 501432
      - name: Required native realtime WebSocket V2 lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_realtime_lifecycle_profile.exs --seed 501432
      - name: Required native realtime SDP and V1 V3 control profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_realtime_sdp_profile.exs --seed 501432
      - name: Required native realtime BEM backing history profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_realtime_bem_profile.exs --seed 501432
      - name: Required native image quota and BEM backing history profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_imagegen_failure_profile.exs --seed 501432
      - name: Required native generated-image artifact and cold history profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_imagegen_success_profile.exs --seed 501432
      - name: Required native user verification and platform gate profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_platform_gates_profile.exs --seed 501432
      - name: Required native defaults and experimental presence profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_default_gates_profile.exs --seed 501432
      - name: Required native managed-network approval amendments
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_network_amendment_profile.exs --seed 501432
      - name: Required native local plugin and marketplace lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_plugin_lifecycle_profile.exs --seed 501432
      - name: Required authenticated native remote-plugin profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_remote_plugin_profile.exs --seed 501432
      - name: Required native remote-plugin schedule metadata profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_remote_plugin_detail_profile.exs --seed 501432
      - name: Required authenticated native plugin-sharing profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_plugin_share_profile.exs --seed 501432
      - name: Required native background terminal lifecycle profile
        timeout-minutes: 8
        working-directory: apps/samgita_codex_driver
        run: mix test test/native_background_terminal_profile.exs --seed 501432

  completeness:
    name: Full compatibility evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory regressions and source consistency
        run: |
          python3 -m unittest discover -s scripts/codex -p 'test_*.py' -v
          python3 scripts/codex/inventory.py --check
      - name: Require every compatibility entry and contract to be verified
        run: python3 scripts/codex/inventory.py --check --require-verified

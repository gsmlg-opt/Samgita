services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: samgita_hub_prod
      POSTGRES_USER: samgita
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samgita -d samgita_hub_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: ${SAMGITA_IMAGE:-samgita:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://samgita:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/samgita_hub_prod
      POOL_SIZE: ${POOL_SIZE:-10}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: 3110
      SAMGITA_API_KEYS: ${SAMGITA_API_KEYS:-}
      MIX_ENV: prod
      RELEASE_COOKIE: ${RELEASE_COOKIE:?Set RELEASE_COOKIE}
    ports:
      - "${HOST_PORT:-3110}:3110"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3110/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: [with-nginx]
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

volumes:
  # New volume: never attach the legacy PostgreSQL data directory.
  hub_postgres_data:

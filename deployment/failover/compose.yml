# One Samgita site of an active/passive pair (see README.md).
# Run on each host with: docker compose --env-file state/site.env ... (or use scripts/site.sh)
# Only the current primary runs `web`; scripts/guard.sh refuses to start it elsewhere.
name: samgita

services:
  db:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - max_slot_wal_keep_size=${MAX_SLOT_WAL_KEEP_SIZE:-20GB}
      - -c
      - hot_standby=on
      - -c
      - wal_log_hints=on
      - -c
      - hba_file=/etc/samgita/pg_hba.conf
    environment:
      POSTGRES_DB: samgita_hub_prod
      POSTGRES_USER: samgita
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?Set MONITOR_PASSWORD}
      REWIND_PASSWORD: ${REWIND_PASSWORD:?Set REWIND_PASSWORD}
      PGPASSFILE: /etc/samgita/pg/pgpass
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/samgita/pg_hba.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/make-standby.sh:/failover/make-standby.sh:ro
      - ${STATE_DIR:-./state}/pg:/etc/samgita/pg:ro
    ports:
      # Replication and peer checks travel only over the WireGuard link.
      - "${WG_ADDR:?Set WG_ADDR}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samgita -d samgita_hub_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: ${SAMGITA_IMAGE:?Set SAMGITA_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    env_file: ${STATE_DIR:-./state}/samgita.env
    environment:
      SAMGITA_PEER_MONITOR_URL: postgresql://samgita_monitor:${MONITOR_PASSWORD}@${PEER_DB_HOST:?Set PEER_DB_HOST}:5432/samgita_hub_prod?connect_timeout=5
    volumes:
      - ./scripts/guard.sh:/failover/guard.sh:ro
      - ${STATE_DIR:-./state}/node:/failover/node:ro
    entrypoint: ["/failover/guard.sh", "./entrypoint.sh"]
    command: ["bin/samgita", "start"]
    ports:
      # Both sites' proxies reach the primary over WireGuard.
      - "${WG_ADDR}:4870:4870"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4870/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  proxy:
    image: caddy:2
    environment:
      SAMGITA_HOST: ${SAMGITA_HOST:?Set SAMGITA_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site.d:/etc/caddy/site.d:ro
      - ${STATE_DIR:-./state}/proxy:/etc/caddy/state:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  hub_postgres_data:
  caddy_data:

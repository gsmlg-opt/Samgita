# Samgita failover pair. Identical on both sites; edit the WireGuard subnet if
# yours is not 10.88.0.0/24. The local socket exists only inside the container.
# TYPE  DATABASE          USER             ADDRESS        METHOD
local   all               all                             trust
# The site's own web container (Compose network).
host    samgita_hub_prod  samgita          samenet        scram-sha-256
# Peer site over WireGuard: streaming replication, pg_rewind, peer role checks.
host    replication       replicator       10.88.0.0/24   scram-sha-256
host    samgita_hub_prod  samgita_rewind   10.88.0.0/24   scram-sha-256
host    samgita_hub_prod  samgita_monitor  10.88.0.0/24   scram-sha-256
